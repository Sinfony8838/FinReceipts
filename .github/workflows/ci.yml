name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: |
          uv sync --locked --python ${{ matrix.python-version }} --extra dev --extra web
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Offline tests (recorded SEC fixtures, fake LLM)
        env:
          FINRECEIPTS_OFFLINE: "1"
        run: uv run pytest -m "not live" --cov --cov-report=term-missing
