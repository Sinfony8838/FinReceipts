[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "finreceipts"
version = "0.0.1"
description = "A verifiable finance research agent harness: every number comes with a receipt."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Sinfony8838" }]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "langgraph>=0.2",
  "anthropic>=0.40",
  "openai>=1.40",
  # ZoneInfo fallback for CNINFO dates on hosts without a system IANA database.
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "pre-commit>=3.7", "httpx>=0.27", "fastapi>=0.115"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]

[project.scripts]
finreceipts = "finreceipts.cli:main"
finreceipts-api = "finreceipts.app.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/finreceipts"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["live: hits the network / real LLM (deselected in CI)"]

[tool.coverage.run]
source = ["finreceipts"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
