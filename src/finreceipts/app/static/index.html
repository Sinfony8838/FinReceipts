<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>快速问答 · FinReceipts</title>
  <script src="/static/ui.js"></script>
  <link rel="stylesheet" href="/static/ui.css">
</head>
<body>
<a class="skip" href="#main">跳到主要内容</a>
<header class="topbar"><div class="topbar-inner">
  <a class="brand" href="/workbench"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Z"/><path d="M9 8h6M9 12h6"/></svg>FinReceipts</a>
  <nav aria-label="主导航"><a href="/workbench">研究工作台</a><a href="/" aria-current="page">快速问答</a></nav>
  <div class="theme-control"><label class="sr-only" for="theme">外观主题</label><select id="theme"><option value="light">浅色</option><option value="dark">深色</option><option value="system">跟随系统</option></select></div>
</div></header>
<main id="main" class="page">
  <div class="page-heading"><div><h1>快速问答</h1><p>提出财务问题，查看数值核验与证据报告。</p></div><span id="environment" class="environment">连接中</span></div>
  <div id="error" class="error-box" role="alert"></div>
  <div class="workspace">
    <aside class="panel settings"><h2>问题设置</h2>
      <div class="example-links"><button id="exAapl" type="button">苹果 · 2023</button><button id="exNvda" type="button">英伟达 · 2025</button></div>
      <form id="ask-form">
        <label for="question">研究问题</label><textarea id="question" required maxlength="12000">总结英伟达（NVDA）2025 财年的业绩，并与 2024 财年对比。</textarea>
        <div class="row"><div><label for="ticker">公司代码</label><input id="ticker" value="NVDA" required maxlength="16"></div><div><label for="years">财年</label><input id="years" value="2024,2025" required></div></div>
        <p class="hint">多个财年用逗号分隔。</p>
        <details class="advanced"><summary>核验设置</summary>
          <label for="mode">执行方式</label><select id="mode"><option value="baseline">回答一次并核验</option><option value="verify" selected>核验后修订</option><option value="cascade">必要时升级模型</option></select>
          <label for="feedback">修订依据</label><select id="feedback"><option value="flags" selected>仅提供错误标记</option><option value="receipts">提供检索数值与证据</option></select>
          <label for="as_of">证据截止日期（可选）</label><input id="as_of" type="date" value="2025-06-30">
        </details>
        <div class="form-actions actions"><button id="btnStream" class="primary" type="submit">开始问答</button><button id="btnAsk" type="button">一次性返回结果</button></div>
      </form>
      <p class="hint">需要保存与恢复任务？前往<a href="/workbench">研究工作台</a>。</p>
      <p class="hint"><a href="/reports/synthetic_receipts.html" target="_blank" rel="noopener">查看示例报告</a></p>
    </aside>
    <div>
      <article class="panel"><div class="panel-header"><h2>证据报告</h2><span id="ask-status" class="badge" role="status">等待提问</span></div>
        <div id="report" class="report-section"><div class="empty"><svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="9" y="5" width="22" height="30" rx="3"/><path d="M14 13h12M14 19h12M14 25h7"/></svg><h3>从一个财务问题开始</h3><p>选择示例或输入问题，回答与数值证据会展示在这里。</p></div></div>
        <div class="metadata hint">数字匹配不等于主体、指标和时期均已核实。报告保留原始内容。</div>
      </article>
      <section class="panel ask-records"><div class="panel-header"><h2>执行记录</h2><span class="muted">当前请求</span></div><div class="panel-section"><ol id="steps" class="timeline"><li class="empty-event">开始问答后，查看各步骤的进展。</li></ol></div></section>
    </div>
  </div>
  <footer class="footer"><span>本地研究工具 · 不构成投资建议</span><span>演示模式使用固定回答，不代表真实模型效果。</span></footer>
</main>
<script src="/static/ask.js"></script>
</body>
</html>
