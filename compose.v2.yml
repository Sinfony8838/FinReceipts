name: finreceipts-v2
x-logging: &logging
  driver: json-file
  options: {max-size: '10m', max-file: '3'}
x-api: &api
  logging: *logging
  build:
    context: .
    dockerfile: server/Dockerfile
  environment: &api-env
    DATABASE_URL: jdbc:mysql://mysql:3306/finreceipts?connectionTimeZone=UTC
    DATABASE_USER: finreceipts
    DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Generate .env.v2}
    REDIS_HOST: redis
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_USER: finreceipts
    RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Generate .env.v2}
    WORKER_SECRET: ${WORKER_SECRET:?Generate .env.v2}
    BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:?Generate .env.v2}
    MODEL_PROVIDER: ${MODEL_PROVIDER:-fake}
    MODEL_ID: ${MODEL_ID:-MiniMax-M3.1-Flash}
    MODEL_BUDGET_MICROS: ${MODEL_BUDGET_MICROS:-10000000}
    OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel:4318/v1/traces
    ARTIFACT_DIR: /artifacts
  volumes: [artifacts:/artifacts]
  depends_on:
    mysql: {condition: service_healthy}
    redis: {condition: service_healthy}
    rabbitmq: {condition: service_healthy}
  deploy:
    resources:
      limits: {cpus: '1.5', memory: 768M}
x-worker: &worker
  logging: *logging
  build:
    context: .
    dockerfile: deploy/v2/worker.Dockerfile
  environment:
    COORDINATOR_URL: http://coordinator:8080
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_USER: finreceipts
    RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    WORKER_SECRET: ${WORKER_SECRET}
    FINRECEIPTS_OFFLINE: ${FINRECEIPTS_OFFLINE:-1}
    FINRECEIPTS_CACHE_DIR: ${FINRECEIPTS_CACHE_DIR:-/fixtures/sec}
    FINRECEIPTS_SEC_USER_AGENT: ${FINRECEIPTS_SEC_USER_AGENT:-FinReceipts contact@example.com}
    MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
    MINIMAX_BASE_URL: ${MINIMAX_BASE_URL:-https://api.minimax.cn/anthropic}
    DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    FAKE_DELAY_SECONDS: ${FAKE_DELAY_SECONDS:-0}
  volumes: [artifacts:/artifacts,sec-cache:/data/sec]
  depends_on: [api1,api2,coordinator]
  deploy:
    resources:
      limits: {cpus: '0.5', memory: 256M}
services:
  mysql:
    logging: *logging
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: finreceipts
      MYSQL_USER: finreceipts
      MYSQL_PASSWORD: ${DATABASE_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD}
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: [CMD,mysqladmin,ping,-h,localhost]
      interval: 5s
      timeout: 3s
      retries: 30
    deploy:
      resources:
        limits: {cpus: '2', memory: 1G}
  redis:
    logging: *logging
    image: redis:8-alpine
    command: [redis-server,--appendonly, 'yes',--maxmemory,256mb,--maxmemory-policy,noeviction]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD,redis-cli,ping]
      interval: 5s
    deploy:
      resources:
        limits: {cpus: '1', memory: 384M}
  rabbitmq:
    logging: *logging
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: finreceipts
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes: [rabbit-data:/var/lib/rabbitmq]
    healthcheck:
      test: [CMD,rabbitmq-diagnostics,-q,ping]
      interval: 5s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits: {cpus: '1', memory: 512M}
  api1: *api
  api2: *api
  coordinator:
    logging: *logging
    image: nginx:1.28-alpine
    volumes: ['./deploy/v2/coordinator.conf:/etc/nginx/conf.d/default.conf:ro']
    depends_on: [api1,api2]
    deploy:
      resources:
        limits: {cpus: '0.5', memory: 64M}
  worker1: *worker
  worker2: *worker
  worker3: *worker
  worker4: *worker
  web:
    logging: *logging
    build:
      context: .
      dockerfile: console/Dockerfile
    ports: ['127.0.0.1:8090:8080']
    depends_on: [api1,api2]
    deploy:
      resources:
        limits: {cpus: '0.5', memory: 128M}
  prometheus:
    logging: *logging
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    volumes: ['./deploy/v2/prometheus.yml:/etc/prometheus/prometheus.yml:ro']
    ports: ['127.0.0.1:9091:9090']
    deploy:
      resources:
        limits: {cpus: '1', memory: 512M}
  grafana:
    logging: *logging
    image: grafana/grafana:12.2.0
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${BOOTSTRAP_PASSWORD}
    volumes: ['./deploy/v2/grafana:/etc/grafana/provisioning:ro',grafana-data:/var/lib/grafana]
    ports: ['127.0.0.1:3001:3000']
    deploy:
      resources:
        limits: {cpus: '0.5', memory: 512M}
  otel:
    logging: *logging
    image: otel/opentelemetry-collector-contrib:0.137.0
    command: ['--config=/etc/otel.yml']
    volumes: ['./deploy/v2/otel.yml:/etc/otel.yml:ro']
    deploy:
      resources:
        limits: {cpus: '0.5', memory: 256M}
volumes:
  mysql-data:
  redis-data:
  rabbit-data:
  artifacts:
  sec-cache:
  grafana-data:
